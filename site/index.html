<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theologische Universiteit Apeldoorn · links</title>
<meta name="description" content="Links van de Theologische Universiteit Apeldoorn">
<meta name="theme-color" content="#F6F1E7">
<meta name="robots" content="index,follow">
<link rel="stylesheet" href="https://use.typekit.net/brn8yvx.css">
<style>
  :root{
    --roze:#BF105A; --roze-donker:#9C0C49;
    --creme:#F6F1E7; --creme-donker:#ECE4D3;
    --tekst:#2B1D22; --tekst-zacht:#6E5E63;
    --sans:"ivystyle-sans","IvyStyle Sans","Aptos","Segoe UI",system-ui,-apple-system,sans-serif;
    --serif:"ivypresto-display","ivypresto-text","IvyPresto Display","IvyPresto Text",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;background:var(--creme);color:var(--tekst);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .wrap{max-width:480px;margin:0 auto;padding:48px 20px 28px;display:flex;flex-direction:column;align-items:center;transition:opacity .2s}
  .wrap.laden{opacity:0}
  .logo{width:104px;height:104px;border-radius:50%;object-fit:contain;background:#fff;border:1px solid var(--creme-donker);padding:10px}
  .monogram{width:104px;height:104px;border-radius:50%;background:var(--roze);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:34px;letter-spacing:.04em}
  h1{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.2;text-align:center;margin:20px 0 6px;text-wrap:balance}
  .bio{margin:0;color:var(--tekst-zacht);font-size:15px;text-align:center;line-height:1.45;max-width:34ch;white-space:pre-line}
  .streep{width:40px;height:2px;background:var(--roze);margin:24px 0 26px;border:0}
  ul.links{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:12px}
  a.link{display:block;text-decoration:none;color:var(--tekst);background:#fff;border:1px solid var(--creme-donker);border-radius:14px;padding:16px 20px;text-align:center;transition:border-color .15s,transform .15s,box-shadow .15s}
  a.link:hover{border-color:var(--roze);box-shadow:0 2px 10px rgba(191,16,90,.10)}
  a.link:active{transform:scale(.99)}
  a.link:focus-visible{outline:3px solid var(--roze);outline-offset:2px}
  .titel{display:block;font-size:16.5px;font-weight:600;line-height:1.3}
  .onder{display:block;font-size:13.5px;color:var(--tekst-zacht);margin-top:3px;line-height:1.35}
  a.link.uitgelicht{background:var(--roze);border-color:var(--roze);color:#fff}
  a.link.uitgelicht .onder{color:rgba(255,255,255,.85)}
  a.link.uitgelicht:hover{background:var(--roze-donker);border-color:var(--roze-donker)}
  .leeg{color:var(--tekst-zacht);font-size:14px;text-align:center}
  footer{margin-top:40px;font-size:12px;color:var(--tekst-zacht);text-align:center;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;gap:10px}
  .stipjes{background:none;border:0;color:var(--tekst-zacht);opacity:.45;font-size:18px;letter-spacing:2px;padding:6px 12px;cursor:pointer;line-height:1;border-radius:8px}
  .stipjes:hover,.stipjes:focus-visible{opacity:1;outline:none;background:var(--creme-donker)}

  /* ---------- Beheer ---------- */
  .bh, .bh *{font-family:var(--sans)}
  dialog.bh{border:0;border-radius:16px;padding:24px;width:min(360px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.25);color:var(--tekst)}
  dialog.bh::backdrop{background:rgba(43,29,34,.45)}
  .bh h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 14px}
  .bh label{display:block;font-size:13px;color:var(--tekst-zacht);margin:10px 0 4px}
  .bh input[type=text],.bh input[type=url],.bh input[type=password],.bh textarea{width:100%;font-size:15px;padding:9px 11px;border:1px solid var(--creme-donker);border-radius:8px;background:#fff;color:var(--tekst)}
  .bh input:focus,.bh textarea:focus{outline:2px solid var(--roze);border-color:transparent}
  .bh textarea{resize:vertical;min-height:54px}
  .bh button{font-size:14px;border-radius:8px;border:1px solid var(--creme-donker);background:#fff;color:var(--tekst);padding:8px 14px;cursor:pointer}
  .bh button:hover{border-color:var(--roze)}
  .bh button:disabled{opacity:.45;cursor:default}
  .bh button.primair{background:var(--roze);border-color:var(--roze);color:#fff}
  .bh button.primair:hover{background:var(--roze-donker)}
  .bh button.klein{padding:5px 9px;font-size:13px}
  .bh .knoppen{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
  .bh .melding{font-size:13px;color:#b00020;min-height:18px;margin-top:8px}

  #paneel{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100vw;background:#FBF9F4;border-left:1px solid var(--creme-donker);box-shadow:-10px 0 40px rgba(0,0,0,.08);display:flex;flex-direction:column;z-index:20;transform:translateX(100%);transition:transform .25s}
  #paneel.open{transform:none}
  #paneel.verstopt{transform:translateX(100%)}
  #paneel .kop{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--creme-donker);background:#fff}
  #paneel .kop h2{margin:0 auto 0 0;font-size:20px}
  #paneel .inhoud{flex:1;overflow:auto;padding:16px 18px 24px}
  #paneel .voet{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--creme-donker);background:#fff}
  #paneel .status{font-size:13px;color:var(--tekst-zacht);margin-right:auto}
  #paneel .status.vuil{color:var(--roze)}
  #paneel .status.fout{color:#b00020}
  .sectie{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--roze);font-weight:600;margin:18px 0 6px}
  .sectie:first-child{margin-top:0}
  .bh-link{border:1px solid var(--creme-donker);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fff}
  .bh-link.verborgen{opacity:.55}
  .bh-link label{margin-top:6px}
  .bh-acties{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .bh-acties .rechts{margin-left:auto;display:flex;gap:6px}
  .schakel{display:inline-flex !important;align-items:center;gap:6px;font-size:13px !important;color:var(--tekst) !important;margin:0 10px 0 0 !important}
  .urlfout{color:#b00020;font-size:12.5px;margin-top:4px}
  #terug{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:21;display:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}
  #terug.zichtbaar{display:block}
  body.bewerken .wrap{padding-bottom:120px}
  @media(min-width:900px){ body.bewerken .wrap{margin-right:calc(440px + max(0px,(100vw - 440px - 480px)/2))} #paneel .alleenMobiel{display:none} }
</style>
</head>
<body>
<main class="wrap laden" id="wrap">
  <div id="logoplek"></div>
  <h1 id="naam"></h1>
  <p class="bio" id="bio"></p>
  <hr class="streep">
  <ul class="links" id="links"></ul>
  <footer>
    <span>Theologische Universiteit Apeldoorn</span>
    <button class="stipjes" id="stipjes" aria-label="Beheer" title="Beheer">•••</button>
  </footer>
</main>

<!-- Inloggen -->
<dialog class="bh" id="login">
  <form id="loginform">
    <h2>Beheer</h2>
    <label for="pw">Wachtwoord</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <div class="melding" id="loginmelding"></div>
    <div class="knoppen">
      <button type="button" id="loginannuleer">Annuleren</button>
      <button type="submit" class="primair" id="loginknop">Inloggen</button>
    </div>
  </form>
</dialog>

<!-- Bewerkpaneel -->
<aside class="bh" id="paneel" aria-label="Links bewerken" hidden>
  <div class="kop">
    <h2>Links bewerken</h2>
    <button class="klein alleenMobiel" id="bekijk">Voorbeeld</button>
    <button class="klein" id="sluit">Sluiten</button>
  </div>
  <div class="inhoud">
    <div class="sectie">Profiel</div>
    <label for="p-naam">Naam</label><input type="text" id="p-naam" maxlength="120">
    <label for="p-bio">Korte tekst</label><textarea id="p-bio" rows="2" maxlength="300"></textarea>
    <label for="p-logo">Logo (bestandsnaam in de site of https-adres)</label><input type="text" id="p-logo" placeholder="logo.png">
    <div class="sectie">Links</div>
    <button id="toevoegen" style="margin-bottom:10px">+ Link toevoegen</button>
    <div id="lijst"></div>
  </div>
  <div class="voet">
    <span class="status" id="status">Alles opgeslagen</span>
    <button id="herstel">Ongedaan maken</button>
    <button class="primair" id="opslaan">Opslaan</button>
  </div>
</aside>
<button class="bh primair" id="terug">Terug naar bewerken</button>

<script src="links.js"></script>
<script>
(function(){
  "use strict";
  var API = "/api/links";
  var $ = function(id){ return document.getElementById(id); };
  var kopie = function(o){ return JSON.parse(JSON.stringify(o)); };

  function veiligeUrl(u){
    u = String(u||"").trim();
    if(!u) return null;
    if(/^(mailto:|tel:)/i.test(u)) return u;
    if(!/^https?:\/\//i.test(u)) u = "https://" + u;
    try{ var p = new URL(u); return ((p.protocol==="http:"||p.protocol==="https:") && p.hostname.indexOf(".")>0) ? p.href : null; }catch(e){ return null; }
  }

  /* ---------------- Weergave ---------------- */
  function render(data){
    data = data || {profiel:{},links:[]};
    var prof = data.profiel || {};
    var naam = prof.naam || "Theologische Universiteit Apeldoorn";
    $("naam").textContent = naam;
    $("bio").textContent = prof.bio || "";
    document.title = naam + " · links";

    var plek = $("logoplek"); plek.innerHTML = "";
    var mono = document.createElement("div");
    mono.className = "monogram"; mono.textContent = "TUA"; mono.setAttribute("aria-hidden","true");
    if(prof.logo){
      var img = document.createElement("img");
      img.className = "logo"; img.alt = naam; img.src = prof.logo;
      img.onerror = function(){ if(img.parentNode) plek.replaceChild(mono, img); };
      plek.appendChild(img);
    } else plek.appendChild(mono);

    var ul = $("links"); ul.innerHTML = ""; var n = 0;
    (data.links||[]).forEach(function(l){
      if(l.zichtbaar === false) return;
      var href = veiligeUrl(l.url);
      if(!href || !l.titel) return;
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.className = "link" + (l.uitgelicht ? " uitgelicht" : "");
      a.href = href; a.rel = "noopener";
      var t = document.createElement("span"); t.className = "titel"; t.textContent = l.titel; a.appendChild(t);
      if(l.ondertitel){ var o = document.createElement("span"); o.className = "onder"; o.textContent = l.ondertitel; a.appendChild(o); }
      li.appendChild(a); ul.appendChild(li); n++;
    });
    if(!n){ var p = document.createElement("li"); p.className = "leeg"; p.textContent = "Nog geen links."; ul.appendChild(p); }
  }

  var opgeslagen = kopie(window.LINKS_DATA || {profiel:{},links:[]});
  function toon(){ $("wrap").classList.remove("laden"); }

  var ctl = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function(){ if(ctl) ctl.abort(); }, 4000);
  fetch(API, {cache:"no-store", signal: ctl ? ctl.signal : undefined})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ if(d && Array.isArray(d.links)) opgeslagen = d; })
    .catch(function(){})
    .then(function(){ clearTimeout(timer); render(opgeslagen); toon(); });

  /* ---------------- Beheer ---------------- */
  var wachtwoord = null, concept = null, vuil = false;

  function zetStatus(t, soort){ var s=$("status"); s.textContent=t; s.className="status"+(soort?" "+soort:""); }
  function gewijzigd(){ vuil=true; zetStatus("Niet opgeslagen","vuil"); render(concept); }

  $("stipjes").addEventListener("click", function(){
    if(wachtwoord){ openPaneel(); return; }
    $("loginmelding").textContent = ""; $("pw").value = "";
    $("login").showModal(); $("pw").focus();
  });
  $("loginannuleer").addEventListener("click", function(){ $("login").close(); });

  $("loginform").addEventListener("submit", function(e){
    e.preventDefault();
    var pw = $("pw").value; if(!pw) return;
    $("loginknop").disabled = true; $("loginmelding").textContent = "";
    fetch(API, {method:"POST", headers:{"Authorization":"Bearer "+pw}})
      .then(function(r){ return r.json().catch(function(){return {};}).then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){
        if(res.ok){ wachtwoord = pw; $("login").close(); openPaneel(); }
        else $("loginmelding").textContent = (res.j && res.j.fout) || "Inloggen mislukt.";
      })
      .catch(function(){ $("loginmelding").textContent = "Geen verbinding met de server."; })
      .then(function(){ $("loginknop").disabled = false; });
  });

  function openPaneel(){
    concept = kopie(opgeslagen); concept.profiel = concept.profiel || {}; concept.links = concept.links || [];
    vuil = false; zetStatus("Alles opgeslagen");
    vulProfiel(); tekenLijst();
    var p = $("paneel"); p.hidden = false;
    requestAnimationFrame(function(){ p.classList.add("open"); p.classList.remove("verstopt"); });
    document.body.classList.add("bewerken");
  }
  function sluitPaneel(){
    if(vuil && !confirm("Je hebt niet-opgeslagen wijzigingen. Toch sluiten?")) return;
    vuil = false; render(opgeslagen);
    var p = $("paneel"); p.classList.remove("open");
    document.body.classList.remove("bewerken");
    $("terug").classList.remove("zichtbaar");
    setTimeout(function(){ p.hidden = true; }, 260);
  }
  $("sluit").addEventListener("click", sluitPaneel);
  $("bekijk").addEventListener("click", function(){ $("paneel").classList.add("verstopt"); $("terug").classList.add("zichtbaar"); window.scrollTo(0,0); });
  $("terug").addEventListener("click", function(){ $("paneel").classList.remove("verstopt"); $("terug").classList.remove("zichtbaar"); });
  $("herstel").addEventListener("click", function(){
    if(!vuil) return;
    if(!confirm("Alle wijzigingen sinds de laatste keer opslaan ongedaan maken?")) return;
    concept = kopie(opgeslagen); vulProfiel(); tekenLijst(); render(concept); vuil=false; zetStatus("Alles opgeslagen");
  });

  function vulProfiel(){
    $("p-naam").value = concept.profiel.naam || "";
    $("p-bio").value = concept.profiel.bio || "";
    $("p-logo").value = concept.profiel.logo || "";
  }
  ["naam","bio","logo"].forEach(function(k){
    $("p-"+k).addEventListener("input", function(e){ concept.profiel[k] = e.target.value; gewijzigd(); });
  });

  function veld(lbl, waarde, type, ph, onInput, max){
    var w = document.createElement("div");
    var l = document.createElement("label"); l.textContent = lbl; w.appendChild(l);
    var i = document.createElement("input"); i.type = type; i.value = waarde || ""; if(ph) i.placeholder = ph; if(max) i.maxLength = max;
    i.addEventListener("input", function(){ onInput(i.value, w); });
    w.appendChild(i); return w;
  }

  function tekenLijst(){
    var lijst = $("lijst"); lijst.innerHTML = "";
    concept.links.forEach(function(l, idx){
      var kaart = document.createElement("div");
      kaart.className = "bh-link" + (l.zichtbaar===false ? " verborgen" : "");
      kaart.appendChild(veld("Titel", l.titel, "text", "Bijv. Open dag", function(v){ l.titel=v; gewijzigd(); }, 120));
      kaart.appendChild(veld("Ondertitel (optioneel)", l.ondertitel, "text", "", function(v){ l.ondertitel=v; gewijzigd(); }, 200));
      var uv = veld("Webadres", l.url, "url", "https://…", function(v, w){
        l.url = v; fout.hidden = !v || !!veiligeUrl(v); gewijzigd();
      });
      var fout = document.createElement("div"); fout.className = "urlfout"; fout.textContent = "Dit lijkt geen geldig webadres.";
      fout.hidden = !l.url || !!veiligeUrl(l.url);
      uv.appendChild(fout); kaart.appendChild(uv);

      var acties = document.createElement("div"); acties.className = "bh-acties";
      function schakel(t, aan, cb){
        var lb = document.createElement("label"); lb.className = "schakel";
        var c = document.createElement("input"); c.type = "checkbox"; c.checked = aan;
        c.addEventListener("change", function(){ cb(c.checked); });
        lb.appendChild(c); lb.appendChild(document.createTextNode(t)); return lb;
      }
      acties.appendChild(schakel("Zichtbaar", l.zichtbaar!==false, function(v){ l.zichtbaar=v; kaart.classList.toggle("verborgen",!v); gewijzigd(); }));
      acties.appendChild(schakel("Uitgelicht", !!l.uitgelicht, function(v){ l.uitgelicht=v; gewijzigd(); }));
      var r = document.createElement("div"); r.className = "rechts";
      function knop(t, titel, cb){ var b=document.createElement("button"); b.className="klein"; b.type="button"; b.textContent=t; b.title=titel; b.setAttribute("aria-label",titel); b.addEventListener("click",cb); r.appendChild(b); return b; }
      knop("↑","Omhoog",function(){ concept.links.splice(idx-1,0,concept.links.splice(idx,1)[0]); tekenLijst(); gewijzigd(); }).disabled = idx===0;
      knop("↓","Omlaag",function(){ concept.links.splice(idx+1,0,concept.links.splice(idx,1)[0]); tekenLijst(); gewijzigd(); }).disabled = idx===concept.links.length-1;
      knop("✕","Verwijderen",function(){ if(confirm("Link “"+(l.titel||"zonder titel")+"” verwijderen?")){ concept.links.splice(idx,1); tekenLijst(); gewijzigd(); } });
      acties.appendChild(r);
      kaart.appendChild(acties);
      lijst.appendChild(kaart);
    });
  }

  $("toevoegen").addEventListener("click", function(){
    concept.links.unshift({titel:"",ondertitel:"",url:"",uitgelicht:false,zichtbaar:true});
    tekenLijst(); gewijzigd();
    var eerste = document.querySelector("#lijst input"); if(eerste) eerste.focus();
  });

  $("opslaan").addEventListener("click", function(){
    var onvolledig = concept.links.filter(function(l){
      var iets = (l.titel||"").trim() || (l.url||"").trim();
      return iets && l.zichtbaar!==false && (!(l.titel||"").trim() || !veiligeUrl(l.url));
    }).length;
    if(onvolledig && !confirm(onvolledig+" link(s) missen een titel of geldig webadres en worden niet getoond. Toch opslaan?")) return;
    var knop = $("opslaan"); knop.disabled = true; zetStatus("Bezig met opslaan…");
    fetch(API, {method:"PUT", headers:{"Authorization":"Bearer "+wachtwoord, "Content-Type":"application/json"}, body: JSON.stringify(concept)})
      .then(function(r){ return r.json().catch(function(){return {};}).then(function(j){ return {ok:r.ok, status:r.status, j:j}; }); })
      .then(function(res){
        if(res.ok && res.j.data){
          opgeslagen = res.j.data; concept = kopie(opgeslagen); vuil = false;
          vulProfiel(); tekenLijst(); render(opgeslagen);
          zetStatus("Opgeslagen om " + new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"}));
        } else {
          if(res.status === 401){ wachtwoord = null; }
          zetStatus((res.j && res.j.fout) || "Opslaan mislukt.", "fout");
        }
      })
      .catch(function(){ zetStatus("Geen verbinding. Probeer opnieuw.", "fout"); })
      .then(function(){ knop.disabled = false; });
  });

  window.addEventListener("beforeunload", function(e){ if(vuil){ e.preventDefault(); e.returnValue=""; } });
})();
</script>
</body>
</html>
